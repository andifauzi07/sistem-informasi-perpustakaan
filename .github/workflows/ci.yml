# Gerbang kualitas PRD §17.3 dan Continuous Deployment migrasi serta Edge Functions.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Skrip postinstall dependency tidak boleh mendapat token bertulis.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      # pgTAP hanya butuh Postgres; stack penuh tidak perlu dinyalakan.
      - run: npx supabase db start
      - run: npm run db:test

  deploy-migrations:
    name: deploy-migrations
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Push migrations to Supabase Cloud
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID, atau SUPABASE_DB_PASSWORD belum disetel di GitHub Secrets."
            exit 1
          fi
          npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
          npx supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_YES: "true"

  deploy-functions:
    name: deploy-functions
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check for function changes
        id: check_functions
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ] || [ -z "${{ github.event.before }}" ]; then
            DIFF_BASE="HEAD~1"
          else
            DIFF_BASE="${{ github.event.before }}"
          fi
          if git diff --name-only "$DIFF_BASE" HEAD | grep -E '^supabase/functions/'; then
            echo "has_functions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_functions=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy Edge Functions to Supabase Cloud
        if: steps.check_functions.outputs.has_functions == 'true'
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN atau SUPABASE_PROJECT_ID belum disetel di GitHub Secrets."
            exit 1
          fi
          for func in supabase/functions/*/; do
            if [ -d "$func" ]; then
              func_name=$(basename "$func")
              if [ -f "$func/index.ts" ]; then
                echo "Mendeploy function: $func_name"
                npx supabase functions deploy "$func_name" --project-ref "$SUPABASE_PROJECT_ID"
              fi
            fi
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
